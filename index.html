<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Song mood classifier · Random Forest on Spotify audio features</title>
    <meta
      name="description"
      content="Set nine Spotify audio features and a Random Forest trained on 278,000 songs names the mood: sad, happy, energetic or calm. Runs in the browser."
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#0b0c0b" />
    <script>
      // Entrances only apply when script runs; if the app never starts, show everything.
      document.documentElement.classList.add('js')
      setTimeout(function () {
        if (!document.documentElement.classList.contains('ready')) document.documentElement.classList.add('reveal-fallback')
      }, 3000)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px">The classifier runs in JavaScript. Turn it on to use it.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
